<!DOCTYPE html>
<html>

<head>

</head>

<style>

h1 {
    color: brown;
}

p {
    color: grey;
}

body {
    background-color: #FFFDD0;
    text-align: center;
}

img {
    width: 500px;
    border-radius: 50%;
}

.foto-animasi {
    animation: fotoMasuk 2s ease-in-out;
}

@keyframes fotoMasuk {
    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

</style>

<body>

<h1>Ellshaz</h1>

<p>Website personal yang menjadi ruang untuk menampilkan karya, kreativitas, serta berbagai aktivitas.</p>
