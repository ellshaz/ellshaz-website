<!DOCTYPE html>
<html>

<head>
    <title>Ellshaz</title>

    <style>

        body {
            background-color: #FFFDD0;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: brown;
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            color: grey;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        /* FOTO */

        .foto-container {
            position: relative;
            display: inline-block;
        }

        img {
            width: 300px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .foto-animasi {
            animation: fotoMasuk 2s ease-in-out;
        }

        @keyframes fotoMasuk {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* SAYAP KIRI DAN KANAN */

        .sayap {
            position: absolute;
            top: 50%;
            width: 70px;
            height: 100px;
            transform: translateY(-50%);
        }

        .sayap-kiri {
            left: -75px;
        }

        .sayap-kanan {
            right: -75px;
        }

        .sayap::before,
        .sayap::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 20px;
            background-color: white;
            border-radius: 100% 0 100% 0;
        }

        .sayap::before {
            top: 25px;
        }

        .sayap::after {
            top: 50px;
        }

        .sayap-kiri::before,
        .sayap-kiri::after {
            right: 0;
            transform: rotate(-25deg);
        }

        .sayap-kanan::before,
        .sayap-kanan::after {
            left: 0;
            transform: rotate(25deg);
        }

    </style>
</head>

<body>

    <h1>Ellshaz!</h1>

    <p>
        Website personal yang menjadi ruang untuk menampilkan karya,
        kreativitas, serta berbagai aktivitas.
    </p>

    <div class="foto-container">

        <div class="sayap sayap-kiri"></div>

        <img class="foto-animasi" src="ellshazpict.jpeg">

        <div class="sayap sayap-kanan"></div>

    </div>

</body>

</html>
