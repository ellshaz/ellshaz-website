<!DOCTYPE html>
<html>

<style>

h1 {
    color: brown;
}

p {
    color: grey;
}

body {
    background-color: #FFFDD0;
    text-align: center;
}

img {
    width: 300px;
    border-radius: 50%;
}

.foto-animasi {
    animation: fotoMasuk 2s ease-in-out;
}

@keyframes fotoMasuk {
    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

</style>

<body>

<h1>Halo, ellshaz!</h1>

<p>Kuhela napas panjang 'tuk siap berlari kembali.</p>

<img class="foto-animasi" src="ellshazpict.jpeg">
<img class="foto-animasi" src="elshaz.jpg">

</body>

</html>
