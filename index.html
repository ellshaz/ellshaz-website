<!DOCTYPE html>
<html>

<head>
    <title>Ellshaz</title>

    <style>

        body {
            background-color: #FFFDD0;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 30px;
            margin: 0;
        }

        /* CARD UTAMA */

        .card {
            background-color: white;
            max-width: 700px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* JUDUL */

        h1 {
            color: brown;
            font-size: 50px;
            margin-bottom: 10px;
        }

        /* DESKRIPSI */

        p {
            color: grey;
            font-size: 18px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* FOTO */

        .foto-container {
            position: relative;
            display: inline-block;
        }

        img {
            width: 300px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        /* ANIMASI FOTO */

        .foto-animasi {
            animation: fotoMasuk 2s ease-in-out;
        }

        @keyframes fotoMasuk {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* SAYAP KIRI DAN KANAN */

        .sayap {
            position: absolute;
            top: 50%;
            width: 70px;
            height: 100px;
            transform: translateY(-50%);
        }

        .sayap-kiri {
            left: -75px;
        }

        .sayap-kanan {
            right: -75px;
        }

        .sayap::before,
        .sayap::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 20px;
            background-color: white;
            border-radius: 100% 0 100% 0;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.08);
        }

        .sayap::before {
            top: 25px;
        }

        .sayap::after {
            top: 50px;
        }

        .sayap-kiri::before,
        .sayap-kiri::after {
            right: 0;
            transform: rotate(-25deg);
        }

        .sayap-kanan::before,
        .sayap-kanan::after {
            left: 0;
            transform: rotate(25deg);
        }

        /* OPENING KEDUA */

        .intro {
            margin: 80px auto;
            max-width: 700px;
            padding: 30px;
        }

        .intro img {
            width: 300px;
            border-radius: 20px;
        }

        .intro p {
            margin-top: 30px;
        }

        /* PASKIBRA */

        .paskibra {
            margin: 100px auto;
            max-width: 800px;
            padding: 40px 20px;
        }

        .paskibra-title {
            font-size: 75px;
            font-weight: bold;
            margin: 0;

            background: linear-gradient(
                to right,
                #d90429 50%,
                white 50%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        .paskibra-year {
            font-size: 25px;
            font-weight: bold;
            color: #d90429;
            margin-top: 5px;
        }

    </style>
</head>

<body>

    <!-- CARD UTAMA -->

    <div class="card">

        <h1>Ellshaz!</h1>

        <p>
            Website personal yang menjadi ruang untuk menampilkan karya,
            kreativitas, serta berbagai aktivitas.
        </p>

        <div class="foto-container">

            <div class="sayap sayap-kiri"></div>

            <img class="foto-animasi" src="ellshazpict.jpeg">

            <div class="sayap sayap-kanan"></div>

        </div>

    </div>


    <!-- OPENING KEDUA -->

    <section class="intro">

        <img src="shazwithcumbri.jpeg" alt="Foto Ellshaz">

        <p>
            Memang hidup itu harus begini adanya.
        </p>

        <a href="https://youtu.be/Fsj_oYe4NS4?si=zjM9C0RFdfNLV_h4" target="_blank">
            ♫
        </a>

    </section>


    <!-- PASKIBRA 2026 -->

    <section class="paskibra">

        <h2 class="paskibra-title">
            PASKIBRA
        </h2>

        <p class="paskibra-year">
            2026
        </p>
<img src="paskib2026.jpeg" alt="Paskibra 2026">

    </section>


</body>

</html>
